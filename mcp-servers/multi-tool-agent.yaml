apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: multi-tool-agent
  namespace: kagent
spec:
  type: Declarative
  description: An agent that uses multiple tool sources
  declarative:
    modelConfig: llama3-model-config
    systemMessage: |
      You are a DevOps assistant. You have access to Kubernetes tools AND utility tools.
      You can combine these. For example:
      1. List pods to find a specific one.
      2. Get its logs.
      3. Base64 encode an interesting part of the log.
    tools:
      - type: McpServer
        mcpServer:
          name: k8s-ops-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - list_pods
            - get_pod_logs
            - get_pod_details
            - list_services
            - get_service_details
            - list_deployments
            - get_deployment_details
            - list_nodes
            - get_node_details
            - list_namespaces
            - list_events
            - delete_pod
      - type: McpServer
        mcpServer:
          name: utils-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - base64_encode
            - base64_decode
            - json_format
