apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: tool-using-agent
  namespace: kagent
spec:
  type: Declarative
  description: An agent that can use calculation and time tools
  declarative:
    modelConfig: llama3-model-config
    systemMessage: |
      You are a helpful assistant with access to tools.
      Use the 'calculator' tool for math problems.
      Use the 'get_current_time' tool when asked for the time.
    tools:
      - type: McpServer
        mcpServer:
          name: demo-mcp-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
