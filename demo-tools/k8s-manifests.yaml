apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-mcp-server
  namespace: kagent
  labels:
    app: demo-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-mcp-server
  template:
    metadata:
      labels:
        app: demo-mcp-server
    spec:
      containers:
      - name: mcp-server
        # IMPORTANT: You must build and push this image, or load it into your cluster
        # Example: docker build -t demo-mcp-server:latest . && kind load docker-image demo-mcp-server:latest --name kagent
        image: demo-mcp-server:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-mcp-server
  namespace: kagent
  labels:
    app: demo-mcp-server
spec:
  selector:
    app: demo-mcp-server
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: demo-mcp-server
  namespace: kagent
spec:
  url: http://demo-mcp-server.kagent.svc.cluster.local:8080
  description: Demo MCP server providing Calculator, Echo, and Time tools
