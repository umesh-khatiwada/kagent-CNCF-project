apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: linux-k8s-expert
  namespace: kagent
spec:
  type: Declarative
  description: Kubernetes expert for my local kind cluster on Linux.
  modelConfig: default-model-config
  systemMessage: |
    You are a Kubernetes expert helping with a single kind cluster.
    Prefer kagent Kubernetes tools for any inspection or debugging.
  tools:
    - type: McpServer
      mcpServer:
        name: kagent-tool-server
        kind: RemoteMCPServer
        apiGroup: kagent.dev
      toolNames:
        - k8sgetresources
        - k8sgetpodlogs
        - k8sdescriberesource
        - k8scheckserviceconnectivity
    - type: McpServer
      mcpServer:
        name: k8s-mcp
        kind: RemoteMCPServer
        apiGroup: kagent.dev
