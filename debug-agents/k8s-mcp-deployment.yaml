---
# K8s MCP Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp
  namespace: kagent
  labels:
    app: k8s-mcp
    service: k8s-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp
  template:
    metadata:
      labels:
        app: k8s-mcp
        service: k8s-mcp
    spec:
      serviceAccountName: k8s-mcp
      containers:
      - name: k8s-mcp
        image: umesh1212/k8s-mcp:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "INFO"
        - name: KUBECONFIG
          value: "/etc/kubernetes/kubeconfig" # Default path if mounted
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: kubeconfig
          mountPath: "/etc/kubernetes"
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: kubeconfig
        secret:
          secretName: host-kubeconfig
---
# K8s MCP Service
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp
  namespace: kagent
  labels:
    app: k8s-mcp
    service: k8s-mcp
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: k8s-mcp
---
# Service Account for K8s MCP
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: kagent
---
# ClusterRole for K8s MCP
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "secrets", "events", "namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies", "ingresses"]
  verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding for K8s MCP
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp
subjects:
- kind: ServiceAccount
  name: k8s-mcp
  namespace: kagent
