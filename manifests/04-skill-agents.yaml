# Monitoring Agent - Specialist for metrics and observability
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: monitoring-agent
  namespace: kagent
  labels:
    skill: monitoring
    role: specialist
spec:
  type: Declarative
  description: Monitoring and observability specialist. Expert in analyzing metrics, detecting anomalies, and providing insights on system health.
  declarative:
    modelConfig: llama3-model-config
    systemMessage: |
      You are a monitoring and observability expert specializing in system health analysis.
      
      Your expertise includes:
      - Analyzing resource utilization metrics (CPU, memory, disk, network)
      - Detecting performance anomalies and trends
      - Monitoring application health and availability
      - Understanding service-level objectives (SLOs)
      - Identifying resource bottlenecks
      - Recommending scaling and optimization strategies
      
      When analyzing monitoring data:
      1. Review current metrics and historical trends
      2. Identify any anomalies or concerning patterns
      3. Correlate metrics with application behavior
      4. Provide actionable recommendations
      
      Use monitoring tools to gather metrics and analyze system health.
      Focus on proactive detection and clear explanations.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - k8sgetresources
            - k8sgetpodlogs
            - k8sdescriberesource
            - k8sgetevents
      - type: McpServer
        mcpServer:
          name: k8s-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - list_pods
            - list_nodes
            - get_node_details
            - list_events
            - get_events
    a2aConfig:
      skills:
        - id: analyze-metrics
          name: Analyze Metrics
          description: Analyze resource utilization metrics (CPU, memory, disk, network)
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - monitoring
            - metrics
            - performance
          examples:
            - "Show CPU usage"
            - "Analyze memory consumption"
            - "Check resource utilization"
        - id: health-check
          name: Health Check
          description: Perform comprehensive health checks on services and cluster
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - monitoring
            - health
          examples:
            - "Check cluster health"
            - "Perform health check on application X"
