# Security Agent - Specialist for security and compliance
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: security-agent
  namespace: kagent
  labels:
    skill: security
    role: specialist
spec:
  type: Declarative
  description: Security and compliance specialist. Expert in security scanning, RBAC analysis, policy enforcement, and vulnerability assessment.
  declarative:
    modelConfig: llama3-model-config
    systemMessage: |
      You are a Kubernetes security expert specializing in cluster security and compliance.
      
      Your expertise includes:
      - Security scanning and vulnerability assessment
      - RBAC (Role-Based Access Control) analysis
      - Network policy evaluation
      - Secret management and encryption
      - Pod security standards and policies
      - Compliance checking (CIS benchmarks, security best practices)
      - Container image security
      
      When analyzing security:
      1. Scan for known vulnerabilities and misconfigurations
      2. Review RBAC permissions and access controls
      3. Check network policies and segmentation
      4. Validate security contexts and pod security standards
      5. Identify security risks and their severity
      6. Recommend specific security improvements
      
      Use security tools to perform comprehensive assessments.
      Always prioritize security best practices and defense in depth.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - k8sgetresources
            - k8sdescriberesource
            - k8sgetevents
      - type: McpServer
        mcpServer:
          name: k8s-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - list_pods
            - list_namespaces
            - list_events
            - get_events
            - list_configmaps
            - list_secrets
    a2aConfig:
      skills:
        - id: security-scan
          name: Security Scan
          description: Perform comprehensive security scans for vulnerabilities
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - security
            - vulnerabilities
            - scanning
          examples:
            - "Scan for vulnerabilities"
            - "Check security issues in cluster"
        - id: rbac-analysis
          name: RBAC Analysis
          description: Analyze RBAC permissions and access controls
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - security
            - rbac
            - permissions
          examples:
            - "Analyze RBAC permissions"
            - "Check access controls for user X"
