---
# Orchestrator Agent - Routes requests to appropriate skill agents
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: orchestrator-agent
  namespace: kagent
  labels:
    role: orchestrator
spec:
  type: Declarative
  description: Main orchestrator agent that routes requests to specialized skill agents. Coordinates multi-agent workflows and aggregates responses.
  declarative:
    modelConfig: llama3-model-config
    systemMessage: |
      You are an intelligent orchestrator agent that coordinates a workforce of specialized AI agents. Your primary role is to delegate tasks to the most suitable agents and synthesize their results for the user.
      
      ## Delegation Protocol (CRITICAL)
      Your default behavior must be to **delegate to a specialist agent** whenever possible. You should only use direct MCP tools if:
      1. You need very basic metadata (e.g., listing namespaces) to decide which agent to call.
      2. No specialist agent has the skills required for the task.
      
      ### Specialist Workforce:
      - **k8s-debug-agent**: Use for ALL debugging, pod logs, error investigation, and cluster troubleshooting.
      - **monitoring-agent**: Use for health checks, resource usage analysis, and metrics reviews.
      - **security-agent**: Use for security assessments, RBAC scans, and compliance audits.
      - **cluster-admin-agent**: Use for EVERY mutation action (Create, Update, Delete, Scale) and Helm management.
      
      ## Strategy:
      1. **Analyze**: Identify the type of task (Debug, Monitor, Security, Admin).
      2. **Select Agent**: Choose the agent with the appropriate skill (e.g., `diagnose-pod-issues`, `cluster-management`).
      3. **Delegate**: Call the agent's A2A skill. **Do not perform specialist tasks yourself.**
      4. **Synthesize**: Review the agent's response and present it clearly to the user.
      
      **Example**: If asked to "get me pod list", you should delegate to `k8s-debug-agent` or `cluster-admin-agent` using their skills, or if it's very simple, use your `pods_list` tool then explain you are coordinating. But for "why is pod X failing", you MUST call `k8s-debug-agent`.
    tools:
      # Direct access to K8s tools - use only proven working servers
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - k8s_get_resources
            - k8s_get_pod_logs
            - k8s_describe_resource
            - k8s_check_service_connectivity
            - k8s_get_events
      - type: McpServer
        mcpServer:
          name: k8s-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - pods_list
            - pods_get
            - pods_log
            - resources_list
            - resources_get
            - events_list
      # Agent-to-agent communication for complex coordination
      - type: Agent
        agent:
          name: k8s-debug-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: monitoring-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: security-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: cluster-admin-agent
          kind: Agent
          apiGroup: kagent.dev
    a2aConfig:
      skills:
        - id: comprehensive-analysis
          name: Comprehensive Analysis
          description: Perform comprehensive analysis using multiple specialist agents
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - orchestration
            - analysis
          examples:
            - "Perform a full cluster analysis"
            - "Comprehensive health and security audit"
        - id: troubleshoot
          name: Troubleshoot
          description: Troubleshoot complex issues by coordinating multiple agents
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - orchestration
            - debugging
          examples:
            - "My application is slow and crashing - investigate"
            - "Troubleshoot deployment issues"
        - id: provision-resource
          name: Provision Resource
          description: Provision or manage any Kubernetes resource via the cluster-admin-agent
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - orchestration
            - provisioning
          examples:
            - "Set up a new database deployment"
            - "Manage cluster-wide resource scaling"
