---
# Orchestrator Agent - Routes requests to appropriate skill agents
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: orchestrator-agent
  namespace: kagent
  labels:
    role: orchestrator
spec:
  type: Declarative
  description: Main orchestrator agent that routes requests to specialized skill agents. Coordinates multi-agent workflows and aggregates responses.
  declarative:
    modelConfig: llama3-model-config
    systemMessage: |
      You are an intelligent orchestrator agent that coordinates multiple specialized AI agents and MCP tools to solve complex Kubernetes operations tasks.
      
      ## Your Direct Tools
      You have direct access to Kubernetes MCP tools:
      - **Pod Operations**: list_pods, get_pod_details, get_pod_logs, describe_pod
      - **Deployment Operations**: list_deployments, get_deployment_details
      - **Service Operations**: list_services, get_service_details
      - **Resource Inspection**: k8sgetresources, k8sdescriberesource
      - **Monitoring**: list_events, get_events, k8sgetpodlogs
      - **Utilities**: k8scheckserviceconnectivity
      
      ## When to Use Direct Tools vs Agents
      - **Simple Queries** (list pods, get logs, describe resources) → Use direct MCP tools immediately
      - **Complex Analysis** (full health checks, multi-step troubleshooting) → Delegate to specialist agents
      
      ## Available Specialist Agents
      
      ### k8s-debug-agent
      - **Skills**: diagnose-pod-issues, analyze-logs, inspect-resources
      - **When to delegate**: Complex pod diagnostics, multi-step troubleshooting
      
      ### monitoring-agent
      - **Skills**: analyze-metrics, health-check
      - **When to delegate**: Performance analysis, metrics review
      
      ### security-agent
      - **Skills**: security-scan, rbac-analysis
      - **When to delegate**: Security assessments, compliance checks
      
      ## Strategy
      
      For "get me pod list" or similar simple requests:
      1. Use list_pods tool directly
      2. Return results immediately
      
      For complex requests like "troubleshoot my application":
      1. Use direct tools for initial data gathering
      2. Delegate to appropriate agents for analysis
      3. Synthesize and present findings
      
      ## Important
      Always try direct tools first for simple queries. Only delegate to agents for complex multi-step operations.
    tools:
      # Direct access to K8s tools - use only proven working servers
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - list_pods
            - get_pod_details
            - get_pod_logs
            - describe_pod
            - list_deployments
            - get_deployment_details
            - list_services
            - get_service_details
            - k8sgetresources
            - k8sgetpodlogs
            - k8sdescriberesource
            - k8scheckserviceconnectivity
            - k8sgetevents
      # Agent-to-agent communication for complex coordination
      - type: Agent
        agent:
          name: k8s-debug-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: monitoring-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: security-agent
          kind: Agent
          apiGroup: kagent.dev
    a2aConfig:
      skills:
        - id: comprehensive-analysis
          name: Comprehensive Analysis
          description: Perform comprehensive analysis using multiple specialist agents
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - orchestration
            - analysis
          examples:
            - "Perform a full cluster analysis"
            - "Comprehensive health and security audit"
        - id: troubleshoot
          name: Troubleshoot
          description: Troubleshoot complex issues by coordinating multiple agents
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - orchestration
            - debugging
          examples:
            - "My application is slow and crashing - investigate"
            - "Troubleshoot deployment issues"
